<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Live threshold signing ceremony: HSM key-share nodes emit partial signatures that combine, once a t-of-n quorum is met, into a single BLS threshold signature, which is verified and policy-checked across an air-gap.">
  <title>threshold-signing-ceremony — live</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e141c"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      :root { color-scheme: dark; }
      text { fill: #e6edf3; }
      .t-dim   { fill: #7d8896; }
      .t-cy    { fill: #39d0d8; }
      .t-grn   { fill: #3fb950; }
      .t-amb   { fill: #d29922; }
      .t-vio   { fill: #a371f7; }
      .stroke-cy  { stroke: #2dd4bf; }
      .node    { fill: #11161d; stroke: #232c38; stroke-width: 1.4; }

      /* --- resting state (also the prefers-reduced-motion frame): a completed snapshot --- */
      .pkt   { opacity: 0; }
      .sig   { opacity: 0; }
      .tline { opacity: 1; }
      .valid { opacity: 1; transform-box: fill-box; transform-origin: center; }
      .ringfill { stroke-dashoffset: 150.8; }   /* 2 of 3 ≈ filled to quorum */

      @keyframes led   { 0%,100%{opacity:.30} 50%{opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes scan  { 0%{transform:translateY(0)} 100%{transform:translateY(296px)} }
      @keyframes appear{ 0%{opacity:0;transform:translateY(3px)} 5%{opacity:0} 11%{opacity:1;transform:none} 92%{opacity:1} 100%{opacity:0} }
      @keyframes pktA  { 0%,8%{opacity:0;transform:translate(0,0)} 9%{opacity:1} 24%{opacity:1;transform:translate(222px,76px)} 27%,100%{opacity:0;transform:translate(222px,76px)} 99.9%{transform:translate(0,0)} }
      @keyframes pktB  { 0%,15%{opacity:0;transform:translate(0,0)} 16%{opacity:1} 31%{opacity:1;transform:translate(222px,0)} 34%,100%{opacity:0;transform:translate(222px,0)} 99.9%{transform:translate(0,0)} }
      @keyframes pktC  { 0%,22%{opacity:0;transform:translate(0,0)} 23%{opacity:1} 38%{opacity:1;transform:translate(222px,-76px)} 41%,100%{opacity:0;transform:translate(222px,-76px)} 99.9%{transform:translate(0,0)} }
      @keyframes ring  { 0%,12%{stroke-dashoffset:452.4} 39%{stroke-dashoffset:150.8} 92%{stroke-dashoffset:150.8} 100%{stroke-dashoffset:452.4} }
      @keyframes sigout{ 0%,40%{opacity:0;transform:translate(0,0)} 42%{opacity:1} 55%{opacity:1;transform:translate(247px,-42px)} 60%,100%{opacity:0;transform:translate(247px,-42px)} 99.9%{transform:translate(0,0)} }
      @keyframes flash { 0%,50%{opacity:0;transform:scale(.6)} 55%{opacity:1;transform:scale(1.18)} 61%{transform:scale(1)} 92%{opacity:1} 100%{opacity:0} }

      .led     { animation: led 1.8s ease-in-out infinite; }
      .cursor  { animation: blink 1s steps(1) infinite; }
      .scan    { animation: scan 6s linear infinite; }
      .pktA    { animation: pktA 9s linear infinite; }
      .pktB    { animation: pktB 9s linear infinite; }
      .pktC    { animation: pktC 9s linear infinite; }
      .ringfill{ animation: ring 9s ease-in-out infinite; }
      .sig     { animation: sigout 9s ease-in-out infinite; }
      .valid   { animation: flash 9s ease-in-out infinite; }
      .tline   { animation: appear 9s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .led, .cursor { opacity: 1; }
      }
    </style>
  </defs>

  <!-- panel -->
  <rect x="12" y="12" width="1176" height="356" rx="16" fill="url(#panel)" stroke="#1c2430" stroke-width="1.5"/>
  <rect class="scan" x="14" y="60" width="1172" height="2" fill="#2dd4bf" opacity="0.06"/>

  <!-- title bar -->
  <circle cx="40" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="38" r="6" fill="#27c93f"/>
  <text x="104" y="43" font-size="14" class="t-dim">threshold-signing-ceremony</text>
  <circle class="led" cx="1108" cy="38" r="5" fill="#3fb950"/>
  <text x="1120" y="43" font-size="13" class="t-grn">live</text>
  <line x1="12" y1="58" x2="1188" y2="58" stroke="#1c2430"/>

  <!-- HSM signer nodes -->
  <g>
    <rect class="node" x="34" y="86" width="156" height="56" rx="10"/>
    <circle class="led" cx="52" cy="104" r="4" fill="#3fb950"/>
    <text x="66" y="110" font-size="13">HSM·1</text>
    <text x="66" y="128" font-size="11" class="t-dim">key share s₁</text>

    <rect class="node" x="34" y="162" width="156" height="56" rx="10"/>
    <circle class="led" cx="52" cy="180" r="4" fill="#3fb950" style="animation-delay:.5s"/>
    <text x="66" y="186" font-size="13">HSM·2</text>
    <text x="66" y="204" font-size="11" class="t-dim">key share s₂</text>

    <rect class="node" x="34" y="238" width="156" height="56" rx="10"/>
    <circle class="led" cx="52" cy="256" r="4" fill="#3fb950" style="animation-delay:1s"/>
    <text x="66" y="262" font-size="13">HSM·3</text>
    <text x="66" y="280" font-size="11" class="t-dim">key share s₃</text>
  </g>

  <!-- transport lines node -> combiner -->
  <g stroke="#1d2735" stroke-width="1.2" fill="none">
    <path d="M190 114 L412 190"/>
    <path d="M190 190 L412 190"/>
    <path d="M190 266 L412 190"/>
  </g>

  <!-- partial-signature packets -->
  <circle class="pkt pktA" cx="190" cy="114" r="5" fill="#39d0d8" filter="url(#glow)"/>
  <circle class="pkt pktB" cx="190" cy="190" r="5" fill="#39d0d8" filter="url(#glow)"/>
  <circle class="pkt pktC" cx="190" cy="266" r="5" fill="#39d0d8" filter="url(#glow)"/>

  <!-- combine node (hexagon) + quorum ring -->
  <g>
    <circle cx="470" cy="190" r="72" fill="none" stroke="#1b2531" stroke-width="6"/>
    <circle class="ringfill" cx="470" cy="190" r="72" fill="none" stroke="#3fb950" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="452.4" transform="rotate(-90 470 190)"/>
    <polygon class="node stroke-cy" points="528,190 499,240 441,240 412,190 441,140 499,140"/>
    <text x="470" y="184" font-size="13" text-anchor="middle">COMBINE</text>
    <text x="470" y="202" font-size="11" text-anchor="middle" class="t-cy">t = 2 · n = 3</text>
  </g>

  <!-- output signature packet -->
  <circle class="sig" cx="528" cy="190" r="6" fill="#a371f7" filter="url(#glow)"/>

  <!-- air-gap boundary -->
  <line x1="660" y1="80" x2="660" y2="300" stroke="#d29922" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.7"/>
  <text x="660" y="74" font-size="10.5" text-anchor="middle" class="t-amb">air-gap</text>

  <!-- verify + policy -->
  <g>
    <rect class="node" x="700" y="120" width="150" height="56" rx="10" stroke="#234b2f"/>
    <text x="775" y="144" font-size="13" text-anchor="middle">BLS verify</text>
    <text class="valid t-grn" x="775" y="163" font-size="12.5" text-anchor="middle">✓ valid</text>

    <rect class="node" x="700" y="196" width="150" height="44" rx="10" stroke="#4a3c1c"/>
    <text x="775" y="223" font-size="12.5" text-anchor="middle" class="t-amb">policy: allow</text>
  </g>

  <!-- pairing equation -->
  <text x="445" y="338" font-size="14" text-anchor="middle" class="t-dim">e(σ, g₂) = e(H(m), pk)</text>

  <!-- console / log panel -->
  <g>
    <rect x="900" y="72" width="276" height="288" rx="10" fill="#080b10" stroke="#1c2430"/>
    <text x="920" y="96" font-size="10.5" fill="#56606b">ceremony.log</text>
    <line x1="900" y1="106" x2="1176" y2="106" stroke="#141b24"/>

    <text class="tline" x="920" y="130" font-size="12.5" style="animation-delay:.2s"><tspan class="t-cy">› </tspan>req 0x9f3a <tspan class="t-dim">recv</tspan></text>
    <text class="tline" x="920" y="156" font-size="12.5" style="animation-delay:.7s"><tspan class="t-cy">› </tspan>share 1/3 <tspan class="t-grn">ok</tspan></text>
    <text class="tline" x="920" y="182" font-size="12.5" style="animation-delay:1.2s"><tspan class="t-cy">› </tspan>share 2/3 <tspan class="t-grn">ok</tspan></text>
    <text class="tline" x="920" y="208" font-size="12.5" style="animation-delay:1.9s"><tspan class="t-cy">› </tspan>quorum t=2 <tspan class="t-grn">met</tspan></text>
    <text class="tline" x="920" y="234" font-size="12.5" style="animation-delay:2.5s"><tspan class="t-cy">› </tspan>σ ← Σ λᵢ·σᵢ</text>
    <text class="tline" x="920" y="260" font-size="12.5" style="animation-delay:3.1s"><tspan class="t-cy">› </tspan>bls verify <tspan class="t-grn">ok</tspan></text>
    <text class="tline" x="920" y="286" font-size="12.5" style="animation-delay:3.6s"><tspan class="t-cy">› </tspan>policy <tspan class="t-grn">allow</tspan></text>
    <text class="tline" x="920" y="312" font-size="12.5" style="animation-delay:4.1s"><tspan class="t-cy">› </tspan>broadcast <tspan class="t-grn">✓</tspan></text>
    <rect class="cursor" x="1006" y="302" width="8" height="13" fill="#3fb950" style="animation-delay:4.4s"/>
  </g>
</svg>
