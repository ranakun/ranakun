<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Live threshold signing ceremony. Of five key shares, two are offline; the remaining three send partial signatures that combine, at a 3 of 5 quorum, into one signature that is then verified.">
  <title>threshold-signing-ceremony, live</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e141c"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      :root { color-scheme: dark; }
      text { fill: #e6edf3; }
      .t-dim { fill: #7d8896; }
      .t-cy  { fill: #39d0d8; }
      .t-grn { fill: #3fb950; }
      .t-red { fill: #f85149; }
      .node  { fill: #11161d; stroke: #232c38; stroke-width: 1.4; }
      .node-off { fill: #130f12; stroke: #3a232a; stroke-width: 1.4; }

      /* resting state == prefers-reduced-motion frame: a completed snapshot */
      .pkt      { opacity: 0; }
      .sig      { opacity: 0; }
      .tline    { opacity: 1; }
      .valid    { opacity: 1; transform-box: fill-box; transform-origin: center; }
      .ringfill { stroke-dashoffset: 0; stroke: #3fb950; }

      @keyframes led    { 0%,100%{opacity:.30} 50%{opacity:1} }
      @keyframes blink  { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes scan   { 0%{transform:translateY(0)} 100%{transform:translateY(296px)} }
      @keyframes appear { 0%{opacity:0} 1.5%{opacity:1} 93%{opacity:1} 100%{opacity:0} }

      /* partial-signature packets: only the 3 online shares (s1 arrive 2.3s, s3 3.3s, s4 4.3s) */
      @keyframes pktS1 { 0%,11%{opacity:0;transform:translate(0,0)} 12%{opacity:1} 25.6%{opacity:1;transform:translate(236px,96px)} 28%{opacity:0;transform:translate(236px,96px)} 99.8%{opacity:0;transform:translate(236px,96px)} 100%{opacity:0;transform:translate(0,0)} }
      @keyframes pktS3 { 0%,22%{opacity:0;transform:translate(0,0)} 23%{opacity:1} 36.7%{opacity:1;transform:translate(236px,0)} 39%{opacity:0;transform:translate(236px,0)} 99.8%{opacity:0;transform:translate(236px,0)} 100%{opacity:0;transform:translate(0,0)} }
      @keyframes pktS4 { 0%,33%{opacity:0;transform:translate(0,0)} 34%{opacity:1} 47.8%{opacity:1;transform:translate(236px,-48px)} 50%{opacity:0;transform:translate(236px,-48px)} 99.8%{opacity:0;transform:translate(236px,-48px)} 100%{opacity:0;transform:translate(0,0)} }

      /* quorum ring: steps exactly as each dot arrives (25.6 / 36.7 / 47.8%); amber below threshold, green at 3 */
      @keyframes ring {
        0%{stroke-dashoffset:402.12;stroke:#d29922}
        25.6%{stroke-dashoffset:402.12;stroke:#d29922}
        25.7%{stroke-dashoffset:268.08;stroke:#d29922}
        36.7%{stroke-dashoffset:268.08;stroke:#d29922}
        36.8%{stroke-dashoffset:134.04;stroke:#d29922}
        47.8%{stroke-dashoffset:134.04;stroke:#d29922}
        47.9%{stroke-dashoffset:0;stroke:#3fb950}
        92%{stroke-dashoffset:0;stroke:#3fb950}
        100%{stroke-dashoffset:402.12;stroke:#d29922}
      }
      @keyframes sigout { 0%,51%{opacity:0;transform:translate(0,0)} 52%{opacity:1} 62%{opacity:1;transform:translate(157px,0)} 64%{opacity:0;transform:translate(157px,0)} 99.8%{opacity:0;transform:translate(157px,0)} 100%{opacity:0;transform:translate(0,0)} }
      @keyframes flash  { 0%,64%{opacity:0;transform:scale(.6)} 66%{opacity:1;transform:scale(1.15)} 70%{transform:scale(1)} 93%{opacity:1} 100%{opacity:0} }

      .led     { animation: led 1.8s ease-in-out infinite; }
      .cursor  { animation: blink 1s steps(1) infinite; }
      .scan    { animation: scan 6s linear infinite; }
      .pktS1   { animation: pktS1 9s linear infinite; }
      .pktS3   { animation: pktS3 9s linear infinite; }
      .pktS4   { animation: pktS4 9s linear infinite; }
      .ringfill{ animation: ring 9s linear infinite; }
      .sig     { animation: sigout 9s ease-in-out infinite; }
      .valid   { animation: flash 9s ease-in-out infinite; }
      .tline   { animation: appear 9s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .led, .cursor { opacity: 1; }
      }
    </style>
  </defs>

  <!-- panel -->
  <rect x="12" y="12" width="1176" height="356" rx="16" fill="url(#panel)" stroke="#1c2430" stroke-width="1.5"/>
  <rect class="scan" x="14" y="60" width="1172" height="2" fill="#2dd4bf" opacity="0.06"/>

  <!-- title bar -->
  <circle cx="40" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="38" r="6" fill="#27c93f"/>
  <text x="104" y="43" font-size="14" class="t-dim">threshold-signing-ceremony</text>
  <circle class="led" cx="1108" cy="38" r="5" fill="#3fb950"/>
  <text x="1120" y="43" font-size="13" class="t-grn">live</text>
  <line x1="12" y1="58" x2="1188" y2="58" stroke="#1c2430"/>

  <!-- 5 key-share nodes (s2 and s5 offline this round) -->
  <g>
    <rect class="node" x="34" y="80" width="168" height="40" rx="9"/>
    <circle class="led" cx="50" cy="100" r="4" fill="#3fb950"/>
    <text x="62" y="104" font-size="11">key share s₁</text>

    <rect class="node-off" x="34" y="128" width="168" height="40" rx="9"/>
    <circle cx="50" cy="148" r="4" fill="#f85149"/>
    <text x="62" y="152" font-size="11" class="t-dim">key share s₂</text>
    <text x="194" y="152" font-size="9.5" text-anchor="end" class="t-red">offline</text>

    <rect class="node" x="34" y="176" width="168" height="40" rx="9"/>
    <circle class="led" cx="50" cy="196" r="4" fill="#3fb950" style="animation-delay:.6s"/>
    <text x="62" y="200" font-size="11">key share s₃</text>

    <rect class="node" x="34" y="224" width="168" height="40" rx="9"/>
    <circle class="led" cx="50" cy="244" r="4" fill="#3fb950" style="animation-delay:1.1s"/>
    <text x="62" y="248" font-size="11">key share s₄</text>

    <rect class="node-off" x="34" y="272" width="168" height="40" rx="9"/>
    <circle cx="50" cy="292" r="4" fill="#f85149"/>
    <text x="62" y="296" font-size="11" class="t-dim">key share s₅</text>
    <text x="194" y="296" font-size="9.5" text-anchor="end" class="t-red">offline</text>
  </g>

  <!-- transport lines (online shares only) -->
  <g stroke="#1d2735" stroke-width="1.2" fill="none">
    <path d="M202 100 L438 196"/>
    <path d="M202 196 L438 196"/>
    <path d="M202 244 L438 196"/>
  </g>

  <!-- partial-signature packets -->
  <circle class="pkt pktS1" cx="202" cy="100" r="5" fill="#39d0d8" filter="url(#glow)"/>
  <circle class="pkt pktS3" cx="202" cy="196" r="5" fill="#39d0d8" filter="url(#glow)"/>
  <circle class="pkt pktS4" cx="202" cy="244" r="5" fill="#39d0d8" filter="url(#glow)"/>

  <!-- combine node + quorum ring -->
  <g>
    <circle cx="490" cy="196" r="64" fill="none" stroke="#1b2531" stroke-width="6"/>
    <circle class="ringfill" cx="490" cy="196" r="64" fill="none" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="402.12" transform="rotate(-90 490 196)"/>
    <polygon class="node" stroke="#2dd4bf" points="542,196 516,241 464,241 438,196 464,151 516,151"/>
    <text x="490" y="192" font-size="13" text-anchor="middle">COMBINE</text>
    <text x="490" y="209" font-size="11" text-anchor="middle" class="t-cy">t = 3 · n = 5</text>
  </g>

  <!-- combined signature packet -->
  <circle class="sig" cx="542" cy="196" r="6" fill="#a371f7" filter="url(#glow)"/>

  <!-- verify signature -->
  <g>
    <rect class="node" x="624" y="172" width="150" height="48" rx="10" stroke="#234b2f"/>
    <text x="699" y="192" font-size="13" text-anchor="middle">verify signature</text>
    <text class="valid t-grn" x="699" y="210" font-size="12.5" text-anchor="middle">✓ valid</text>
  </g>

  <!-- console / log panel (line reveals synced to dot arrivals) -->
  <g>
    <rect x="900" y="72" width="276" height="288" rx="10" fill="#080b10" stroke="#1c2430"/>
    <text x="920" y="96" font-size="10.5" fill="#56606b">ceremony.log</text>
    <line x1="900" y1="106" x2="1176" y2="106" stroke="#141b24"/>

    <text class="tline" x="920" y="130" font-size="12.5" style="animation-delay:.3s"><tspan class="t-cy">› </tspan>req 0x9f3a <tspan class="t-dim">recv</tspan></text>
    <text class="tline" x="920" y="156" font-size="12.5" style="animation-delay:2.3s"><tspan class="t-cy">› </tspan>share s₁ <tspan class="t-grn">✓</tspan></text>
    <text class="tline" x="920" y="182" font-size="12.5" style="animation-delay:2.6s"><tspan class="t-cy">› </tspan>share s₂ <tspan class="t-red">✗ offline</tspan></text>
    <text class="tline" x="920" y="208" font-size="12.5" style="animation-delay:3.3s"><tspan class="t-cy">› </tspan>share s₃ <tspan class="t-grn">✓</tspan></text>
    <text class="tline" x="920" y="234" font-size="12.5" style="animation-delay:4.3s"><tspan class="t-cy">› </tspan>share s₄ <tspan class="t-grn">✓</tspan> · <tspan class="t-grn">quorum</tspan></text>
    <text class="tline" x="920" y="260" font-size="12.5" style="animation-delay:4.6s"><tspan class="t-cy">› </tspan>share s₅ <tspan class="t-red">✗ offline</tspan></text>
    <text class="tline" x="920" y="286" font-size="12.5" style="animation-delay:5.2s"><tspan class="t-cy">› </tspan>combine shares <tspan class="t-grn">✓</tspan></text>
    <text class="tline" x="920" y="312" font-size="12.5" style="animation-delay:5.9s"><tspan class="t-cy">› </tspan>verify signature <tspan class="t-grn">✓</tspan></text>
    <rect class="cursor" x="1110" y="302" width="8" height="13" fill="#3fb950" style="animation-delay:6.1s"/>
  </g>
</svg>
